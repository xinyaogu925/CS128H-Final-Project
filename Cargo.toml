[package]
name = "echosafe"
version = "0.1.0"
edition = "2021"

[dependencies]
# Audio decoding
symphonia = { version = "0.5", features = ["all"] }
# WAV encoding
hound = "3.5"
# CLI parsing
clap = { version = "4.4", features = ["derive"] }
# FFT for spectral analysis
rustfft = "6.1"
realfft = "3.3"
num-complex = "0.4"
# Additional utilities
anyhow = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = "1.8"
